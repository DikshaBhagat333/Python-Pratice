<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Day</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: #ffffff;
      padding: 3rem 4rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      color: #e056fd;
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #555;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Day to You! ☀️</h1>
    <p>Wishing you a wonderful and bright day ahead.</p>
  </div>

</body>
</html>
